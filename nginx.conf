user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Agregar soporte para archivos .mjs (ES modules)
    types {
        application/javascript mjs;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html index.htm;

        # Cache-busting for versioned assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            # Versioned files (with hash) - cache for 1 year
            if ($request_filename ~ "-[a-z0-9]{8}\.(js|css)$") {
                expires 1y;
                add_header Cache-Control "public, immutable";
                add_header X-Content-Type-Options "nosniff";
            }
            # Non-versioned files - cache for 1 month
            expires 1M;
            add_header Cache-Control "public, must-revalidate";
            add_header X-Content-Type-Options "nosniff";
        }

        # Cache images for 30 days
        location ~* \.(webp|png|jpg|jpeg|gif|ico)$ {
            expires 30d;
            add_header Cache-Control "public, must-revalidate";
            add_header X-Content-Type-Options "nosniff";
        }

        # Cache fonts for 1 year
        location ~* \.(woff|woff2|ttf|eot|otf)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # HTML - no cache, always revalidate
        location ~* \.html?$ {
            expires -1;
            add_header Cache-Control "public, must-revalidate, max-age=0";
            add_header X-Content-Type-Options "nosniff";
        }

        # SPA routing - serve index.html for unknown routes
        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
            add_header Cache-Control "public, must-revalidate, max-age=0";
            add_header X-Content-Type-Options "nosniff";
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
