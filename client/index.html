<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="description" content="Corporación Paso a Paso: Transformamos vidas con proyectos sociales y servicios innovadores en Colombia.">
    
    <!-- DNS Prefetch para optimizar conexiones -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    
    <!-- Preconnect para fuentes externas -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Google Fonts optimizado -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <link
      rel="stylesheet"
      href="/assets/index-meOqgsVW.css"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      />
    </noscript>
    <noscript>
      <link rel="stylesheet" href="/assets/index-meOqgsVW.css" />
    </noscript>

    <!-- Preload imágenes críticas para LCP -->
    <link
      rel="preload"
      as="image"
      href="/src/assets/images/hero-background-primary.webp"
      type="image/webp"
      fetchPriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/src/assets/images/logo-paso-a-paso.webp"
      type="image/webp"
      fetchPriority="high"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3E4095" />
    <title>Corporación Paso A Paso</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
